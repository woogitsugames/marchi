<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2b2620; overflow: hidden; }
      canvas { display: block; }
      #info {
        position: fixed; left: 8px; bottom: 8px; color: #c9c6bb; font: 11px/1.35 monospace;
        background: rgba(43, 38, 32, 0.72); padding: 6px 8px; white-space: pre; pointer-events: none;
      }
      #views { position: fixed; right: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
      #views a { color: #c9c6bb; background: rgba(43, 38, 32, 0.8); padding: 4px 8px; font: 12px monospace; text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="views"></div>
    <div id="info"></div>
    <script type="module" src="./model-preview.ts"></script>
  </body>
</html>
