name: Stage Marchia icon v3 (one-time)
on:
  push:
    branches:
      - feat/app-icon-v3-grenze-woodcut
    paths:
      - '.github/workflows/stage-app-icon-v3.yml'
      - 'art/app-icon*.svg'
      - 'tools/make-icons.mjs'
      - 'tools/check-icons.mjs'
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate only under art/out and docs/shots
        run: npm run icons
      - name: Check staged native assets and adaptive safe area
        run: npm run icons:check
      - name: Prevent concurrent native edits
        run: |
          test -z "$(git status --porcelain -- android ios)"
      - name: Commit generated staged assets to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/out/ art/app-icon-foreground.svg art/app-icon-monochrome.svg docs/shots/app-icon.png docs/shots/app-icon-variants.png docs/shots/app-icon-v2-v3.png
          if ! git diff --cached --quiet; then
            git commit -m "art: stage native icon v3 exports and rendered comparisons"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
