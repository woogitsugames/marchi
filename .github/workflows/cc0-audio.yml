name: CC0 field-recording audio
on:
  push:
    branches:
      - gpt/07-realistic-recordings
    paths:
      - tools/process_audio.py
      - tools/audio_sources.json
      - .github/workflows/cc0-audio.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install FFmpeg and FFprobe (Ubuntu 26 runners do not include them)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python3 --version

      - name: Render approved CC0 field recordings
        run: python3 tools/process_audio.py --fetch

      - name: Verify 46 assets, stereo/mono and 4 MiB budget
        run: python3 tools/process_audio.py --check

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Upload preview audio artifact for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cc0-audio-${{ github.sha }}
          path: |
            public/assets/audio/ambient/*.ogg
            public/assets/audio/ambient/*.m4a
            public/assets/audio/sfx/bridge-wood.ogg
            public/assets/audio/sfx/bridge-wood.m4a
            docs/audio-provenance.json
          retention-days: 7

      - name: Commit processed OGG/M4A and source fingerprints
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/audio/ambient public/assets/audio/sfx/bridge-wood.ogg public/assets/audio/sfx/bridge-wood.m4a docs/audio-provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(audio): replace five synthetic tracks with genuine CC0 recordings"
            git push origin "HEAD:gpt/07-realistic-recordings"
          fi
