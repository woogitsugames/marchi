name: Mission balance grid

on:
  push:
    branches:
      - 'gpt/balance-grid-26'
    paths:
      - 'tools/balance-grid.ts'
      - '.github/workflows/balance-grid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  balance-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Evaluate mission grid and write report
        run: npx tsx tools/balance-grid.ts
      - name: Publish generated report in this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/balance/REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(balance): publish reproducible six-seed balance report'
            git push
          fi
