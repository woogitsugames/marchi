name: Debug APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 36 and build-tools 36.1.0
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.1.0'

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: npm run apk

      - name: Upload debug APK (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: dist-apk/*.apk
          retention-days: 14
          if-no-files-found: error
