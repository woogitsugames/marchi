name: Mission IV proposal

on:
  # CI minutes are limited (owner, 2026-11-03): manual runs only.
  workflow_dispatch:

jobs:
  verify-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests for the ice proposal
        run: npx tsx tests/run.ts m4-ice
      - name: Mission IV traversability WITHOUT integrated ice
        run: npx tsx tools/bot-m4.ts
      - name: Mission IV stone upgrade WITHOUT integrated ice
        run: npx tsx tools/bot-m4.ts --stone
