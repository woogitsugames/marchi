name: Store screenshots

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Screenshot language'
        type: choice
        default: all
        options: [all, pl, en]
      orientation:
        description: 'Output orientation'
        type: choice
        default: all
        options: [all, portrait, landscape]
      shots:
        description: 'Shot IDs (all or comma-separated 1..6)'
        type: string
        default: all

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright runner (CI only)
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium (CI only)
        run: npx playwright install --with-deps chromium

      - name: Generate and verify real gameplay screenshots
        env:
          SHOTS_LANG: ${{ inputs.language }}
          SHOTS_ORIENTATION: ${{ inputs.orientation }}
          SHOTS_IDS: ${{ inputs.shots }}
        run: node tools/store-shots.mjs --lang="$SHOTS_LANG" --orientation="$SHOTS_ORIENTATION" --shot="$SHOTS_IDS"

      - name: Upload screenshots and verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-${{ github.run_number }}
          path: art/store/screens/
          if-no-files-found: warn
          retention-days: 14
